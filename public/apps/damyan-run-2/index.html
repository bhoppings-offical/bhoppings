<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower Runner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Tower Runner</h2>
      <canvas id="game" width="900" height="300" aria-label="Tower Runner game" role="img"></canvas>
      <div class="help">
        <div>
          <span class="kbd">Space</span> / <span class="kbd">↑</span> / Click: Jump
        </div>
        <div>
          <span class="kbd">R</span> / <span class="kbd">Enter</span>: Restart after Game Over
        </div>
      </div>
    </div>
    <script src="./game.js" defer></script>
  </body>
  </html>
