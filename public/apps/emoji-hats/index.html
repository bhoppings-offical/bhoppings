<style>
:root{--ink:#1d1b3a;--e:cubic-bezier(.34,1.56,.64,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#ffd23f;transition:background .6s;font:22px 'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;color:var(--ink);user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:relative;height:100%;width:100%}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:14px;text-align:center}
.scr.on{display:flex}
.h{color:#fff;font-size:clamp(28px,7vw,46px);text-shadow:0.075em 0.000em 0 var(--ink),0.069em 0.029em 0 var(--ink),0.053em 0.053em 0 var(--ink),0.029em 0.069em 0 var(--ink),0.000em 0.075em 0 var(--ink),-0.029em 0.069em 0 var(--ink),-0.053em 0.053em 0 var(--ink),-0.069em 0.029em 0 var(--ink),-0.075em 0.000em 0 var(--ink),-0.069em -0.029em 0 var(--ink),-0.053em -0.053em 0 var(--ink),-0.029em -0.069em 0 var(--ink),-0.000em -0.075em 0 var(--ink),0.029em -0.069em 0 var(--ink),0.053em -0.053em 0 var(--ink),0.069em -0.029em 0 var(--ink),0.075em 0.130em 0 var(--ink),0.069em 0.159em 0 var(--ink),0.053em 0.183em 0 var(--ink),0.029em 0.199em 0 var(--ink),0.000em 0.205em 0 var(--ink),-0.029em 0.199em 0 var(--ink),-0.053em 0.183em 0 var(--ink),-0.069em 0.159em 0 var(--ink),-0.075em 0.130em 0 var(--ink),-0.069em 0.101em 0 var(--ink),-0.053em 0.077em 0 var(--ink),-0.029em 0.061em 0 var(--ink),-0.000em 0.055em 0 var(--ink),0.029em 0.061em 0 var(--ink),0.053em 0.077em 0 var(--ink),0.069em 0.101em 0 var(--ink);letter-spacing:1px}
.btn{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:10px 28px;font-size:28px;box-shadow:0 7px 0 var(--ink);transition:transform .18s var(--e),box-shadow .12s;position:relative}
.btn:hover{transform:scale(1.07) rotate(-2deg)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.btn.dis{opacity:.5;filter:grayscale(1);cursor:not-allowed}
.btn.dis small{position:absolute;right:-14px;top:-16px;background:#ff5d73;color:#fff;border:3px solid var(--ink);border-radius:10px;font-size:14px;padding:0 7px;transform:rotate(12deg)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{width:74px;height:74px;padding:0;font-size:36px}
.opt.sel{background:var(--ink);color:#fff}
#title{display:flex;flex-direction:column;gap:10px;align-items:center}
#title div{display:flex;gap:8px}
#title b{display:grid;place-items:center;width:min(17vw,86px);height:min(19vw,96px);border:5px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);font-weight:400;font-size:min(12vw,64px);color:#fff;text-shadow:0 4px 0 var(--ink);animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.23s)}
