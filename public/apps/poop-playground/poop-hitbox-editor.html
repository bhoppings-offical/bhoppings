<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poop Hitbox Editor</title>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; margin: 0; }
    #toolbar { padding: 12px; background: #333; display: flex; align-items: center; gap: 16px; }
    #canvas { background: #222; display: block; margin: 0 auto; border: 2px solid #444; }
    #export { margin-left: 16px; }
    #json-output { width: 100%; height: 80px; margin-top: 12px; font-family: monospace; }
    label { font-size: 1.1em; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Skin:
      <select id="skin-select"></select>
    </label>
    <button id="add-point">Add Point</button>
    <button id="remove-point">Remove Point</button>
    <button id="export">Export JSON</button>
    <span style="margin-left:24px; color:#aaa;">Left click: move/add point, Right click: remove point</span>
  </div>
  <canvas id="canvas" width="320" height="320"></canvas>
  <textarea id="json-output" readonly></textarea>
  <script>
    const SKIN_COUNT = 20;
    const skinImages = [];
    for (let i = 0; i < SKIN_COUNT; ++i) {
      const img = new window.Image();
      img.src = `images/skins/${i}.svg`;
      skinImages.push(img);
    }
    // Hitbox data: array of polygons per skin
    let hitboxes = Array(SKIN_COUNT).fill(null).map(() => []);
    // UI elements
    const skinSelect = document.getElementById('skin-select');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const exportBtn = document.getElementById('export');
    const jsonOutput = document.getElementById('json-output');
    const addPointBtn = document.getElementById('add-point');
    const removePointBtn = document.getElementById('remove-point');
    // Populate skin dropdown
    for (let i = 0; i < SKIN_COUNT; ++i) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Skin ${i}`;
      skinSelect.appendChild(opt);
    }
    let currentSkin = 0;
    let draggingIdx = null;
    let dragOffset = {x:0, y:0};
    // Canvas logic
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Draw poop image centered
      const img = skinImages[currentSkin];
      if (img.complete) {
        ctx.save();
        ctx.globalAlpha = 0.95;
        ctx.drawImage(img, 40, 40, 240, 240);
        ctx.restore();
      }
      // Draw polygon
      const poly = hitboxes[currentSkin];
      if (poly.length > 0) {
        ctx.save();
        ctx.strokeStyle = '#ffb300';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let i = 1; i < poly.length; ++i) ctx.lineTo(poly[i].x, poly[i].y);
        ctx.closePath();
        ctx.stroke();
        // Draw points
        for (let i = 0; i < poly.length; ++i) {
          ctx.beginPath();
          ctx.arc(poly[i].x, poly[i].y, 7, 0, Math.PI*2);
          ctx.fillStyle = draggingIdx === i ? '#ffb300' : '#fff';
          ctx.fill();
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }
    }
    // Mouse logic
    let addingPoint = false;
    let removingPoint = false;
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const poly = hitboxes[currentSkin];
      if (e.button === 2 || removingPoint) { // right click: remove
        for (let i = 0; i < poly.length; ++i) {
          if (Math.hypot(mx - poly[i].x, my - poly[i].y) < 12) {
            poly.splice(i, 1);
            draw();
            e.preventDefault();
            return;
          }
        }
      } else if (addingPoint) {
        poly.push({x: mx, y: my});
        addingPoint = false;
        draw();
      } else {
        // Try to drag a point
        for (let i = 0; i < poly.length; ++i) {
          if (Math.hypot(mx - poly[i].x, my - poly[i].y) < 12) {
            draggingIdx = i;
            dragOffset.x = mx - poly[i].x;
            dragOffset.y = my - poly[i].y;
            draw();
            return;
          }
        }
        // If not on a point, add a new one
        poly.push({x: mx, y: my});
        draw();
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      if (draggingIdx !== null) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        hitboxes[currentSkin][draggingIdx] = {x: mx - dragOffset.x, y: my - dragOffset.y};
        draw();
      }
    });
    canvas.addEventListener('mouseup', (e) => {
      draggingIdx = null;
      draw();
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    // Toolbar buttons
    addPointBtn.onclick = () => { addingPoint = true; };
    removePointBtn.onclick = () => { removingPoint = true; setTimeout(() => { removingPoint = false; }, 2000); };
    skinSelect.onchange = () => { currentSkin = parseInt(skinSelect.value, 10); draw(); };
    exportBtn.onclick = () => {
      jsonOutput.value = JSON.stringify(hitboxes, null, 2);
    };
    // Redraw when images load
    for (const img of skinImages) img.onload = draw;
    draw();
  </script>
</body>
</html>
