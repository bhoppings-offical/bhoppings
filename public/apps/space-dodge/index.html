<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dodge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1a3e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            text-align: center;
        }

        canvas {
            border: 3px solid #4a90e2;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 144, 226, 0.5);
            background: #000814;
        }

        #ui {
            margin-top: 20px;
            color: white;
        }

        #score {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4af2a1;
        }

        #highScore {
            font-size: 18px;
            color: #f2c94c;
            margin-bottom: 15px;
        }

        #gameOver {
            display: none;
            font-size: 32px;
            color: #ff6b6b;
            margin-bottom: 15px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #instructions {
            color: #a0a0a0;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="highScore">High Score: 0</div>
            <div id="gameOver">GAME OVER!</div>
            <button id="startBtn">Start Game</button>
            <div id="instructions">Use Arrow Keys or WASD to move your spaceship • Avoid the asteroids!</div>
        </div>
    </div>

    <script>
        "use strict";
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameOverDisplay = document.getElementById('gameOver');
        const jetParticles = [];
        class JetParticle {
            constructor(x, y, size, dSize, vx, vy) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.dSize = dSize;
                this.maxSize = 20;
                this.vel = [vx, vy];
            }
            grow() {
                this.size += this.dSize;
                this.x += this.vel[0];
                this.y += this.vel[1];
            }
            checkKill() {
                return this.size >= this.maxSize ||
                    this.y + this.size/2 >= canvas.height ||
                    this.y - this.size/2 <= 0 ||
                    this.x + this.size/2 >= canvas.width ||
                    this.x - this.size/2 <= 0;
            }

            draw(ctx) {
                const color = "rgba(255, 255, 255, 0.2)";
                ctx.beginPath();
                ctx.fillStyle = color;
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, this.size / 2, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        highScoreDisplay.textContent = `High Score: ${highScore}`;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: 40,
            height: 40,
            speedY: 15,
            speedX: 7.3,
            dx: 0,
            dy: 0
        };

        // Asteroids
        let asteroids = [];
        let asteroidSpeed = 3;
        let asteroidSpawnRate = 60; // frames
        let frameCount = 0;

        // Stars background
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Draw player (spaceship)
        function drawPlayer() {
    const tiltAngle = 20 * Math.PI / 180; // 10 degrees in radians
    let rotation = 0;

    const holdingD = keys['d'] || keys['D'];
    const holdingA = keys['a'] || keys['A'];

    if (holdingD && !holdingA) {
        rotation = tiltAngle; // rotate right
    } else if (holdingA && !holdingD) {
        rotation = -tiltAngle; // rotate left
    }
    // if both pressed → rotation stays 0

    ctx.save();

    // Move origin to player center
    ctx.translate(player.x, player.y);
    ctx.rotate(rotation);

    ctx.fillStyle = '#4af2a1';
    ctx.beginPath();
    ctx.moveTo(0, -player.height / 2);
    ctx.lineTo(-player.width / 2, player.height / 2);
    ctx.lineTo(0, player.height / 4);
    ctx.lineTo(player.width / 2, player.height / 2);
    ctx.closePath();
    ctx.fill();

    // Engine glow
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(0, player.height / 2, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}


        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.fillStyle = '#8b4513';
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(asteroid.x, asteroid.y, asteroid.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Add some detail
            ctx.fillStyle = '#5c3317';
            ctx.beginPath();
            ctx.arc(asteroid.x - asteroid.radius / 3, asteroid.y - asteroid.radius / 3, asteroid.radius / 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw stars
        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        // Update player position
        function updatePlayer() {
            player.dx = 0;
            player.dy = 0;

            const avgSpeed = (player.speedX + player.speedY) / 2;
const angle45 = Math.PI / 4; // 45 degrees in radians
const sin45 = Math.sin(angle45); // ≈ 0.7071
const cos45 = Math.cos(angle45); // ≈ 0.7071

player.dx = 0;
player.dy = 0;

if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
    player.dx -= avgSpeed * cos45;
}
if (keys['ArrowRight'] || keys['d'] || keys['D']) {
    player.dx += avgSpeed * cos45;
}
if (keys['ArrowUp'] || keys['w'] || keys['W']) {
    player.dy -= avgSpeed * sin45;
}
if (keys['ArrowDown'] || keys['s'] || keys['S']) {
    player.dy += avgSpeed * sin45;
}


            player.x += player.dx;
            player.y += player.dy;

            // Boundary checking
            if (player.x - player.width / 2 < 0) player.x = player.width / 2;
            if (player.x + player.width / 2 > canvas.width) player.x = canvas.width - player.width / 2;
            if (player.y - player.height / 2 < 0) player.y = player.height / 2;
            if (player.y + player.height / 2 > canvas.height) player.y = canvas.height - player.height / 2;
        }

        // Spawn asteroids
        function spawnAsteroid(big = false) {
            const radius = big ? 200 : Math.random() * 20 + 15;
            const asteroid = {
                x: big ? (1 + (Math.random() * canvas.width)) / 2 : Math.random() * canvas.width,
                y: - radius,
                radius,
                speed: asteroidSpeed + Math.random() * 2
            };
            asteroids.push(asteroid);
        }

        var bigSpawned = true;
        const bigScoreInterval = 400;
        // Update asteroids
        function updateAsteroids() {
            asteroids.forEach((asteroid, index) => {
                asteroid.y += asteroid.speed;

                // Remove off-screen asteroids
                if (asteroid.y - asteroid.radius > canvas.height) {
                    asteroids.splice(index, 1);
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                }
            });

            // Spawn new asteroids
            if ((frameCount % asteroidSpawnRate === 0) && (score % bigScoreInterval !== 0 || score === 0)) {
                spawnAsteroid();
            }
            if (score % bigScoreInterval === 0 && score !== 0) {
                if (!bigSpawned) spawnAsteroid(true);
                bigSpawned = true;
            } else {
                bigSpawned = false;
            }

            // Increase difficulty over time
            if (score > 0 && score % 200 === 0 && asteroidSpawnRate > 20) {
                asteroidSpawnRate--;
                asteroidSpeed += 0.1;
            }
        }

        // Collision detection
        function checkCollision() {
            for (let asteroid of asteroids) {
                const dx = player.x - asteroid.x;
                const dy = player.y - asteroid.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < asteroid.radius + player.width / 2) {
                    return true;
                }
            }
            return false;
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateStars();
            drawStars();
            updatePlayer();
            updateAsteroids();

            asteroids.forEach(drawAsteroid);
            drawPlayer();

            if (checkCollision()) {
                endGame();
                return;
            }
            for (let i = 0; i < 5; i ++) {
                const particleAngle = (Math.random() + 0.5) * Math.PI * 0.5;
            const [dx, dy] = [Math.cos(particleAngle), Math.sin(particleAngle)]
            jetParticles.push(new JetParticle(player.x + (Math.random() - 0.5) * 10, player.y + (Math.random()) * 10, Math.random() * 8, 0.1 * (1 + Math.random()), dx, dy));
            }
            for (const particle of jetParticles) {
                if (particle.checkKill()) {
                    const index = jetParticles.indexOf(particle);
                    if (index > -1) {
                        jetParticles.splice(index, 1);
                        continue;
                    } else {
                        throw new Error("tangos jet particle didnt exist in the list")
                    }

                }
                particle.draw(ctx);
                particle.grow();
            }
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            gameRunning = true;
            score = 0;
            asteroids = [];
            asteroidSpeed = 3;
            asteroidSpawnRate = 60;
            frameCount = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;

            scoreDisplay.textContent = 'Score: 0';
            gameOverDisplay.style.display = 'none';
            startBtn.textContent = 'Restart Game';

            gameLoop();
        }

        // End game
        function endGame() {
            gameRunning = false;
            gameOverDisplay.style.display = 'block';

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
                highScoreDisplay.textContent = `High Score: ${highScore}`;
            }
        }

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
