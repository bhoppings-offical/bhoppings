*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {

}

}

}

.search-wrap {

  width: min(480px, 90vw);
}

.search-wrap input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 52px 14px 20px;
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--white);
  outline: none;

}

.search-wrap input::placeholder {

}

.search-wrap input:focus {
  border-color: rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.08);
}

.search-wrap button {
  position: absolute;

  opacity: 0.45;

}

.search-wrap button:hover { opacity: 1; }

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.credit {

  letter-spacing: 0.04em;
  margin-top: -10px;
  text-align: center;
}

.credit span {
  color: rgba(255,255,255,0.55);
}

<body>

<canvas id="stars"></canvas>

<div class="container">
  <h1>vera</h1>

  <div class="search-wrap">
    <input
      id="urlInput"
      type="text"
      placeholder="enter a url..."
      autocomplete="off"
      spellcheck="false"
    />
    <button onclick="navigate()" aria-label="Go">
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <p class="credit">vera proxy — made with <span>♡</span> by bhoppings</p>
</div>



<script>

// ai math 😊✖️➗➕➖🧮♾️

  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const staticStars = Array.from({ length: 120 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 0.8 + 0.2,
    o: Math.random() * 0.5 + 0.1,
  }));

  class Streak {
    constructor() { this.reset(true); }
    reset(immediate = false) {
      this.x     = Math.random() * canvas.width * 1.2;
      this.y     = Math.random() * canvas.height * 0.4;
      this.len   = Math.random() * 80 + 100;
      this.speed = Math.random() * 2 + 4;
      this.angle = Math.PI / 5 + (Math.random() - 0.5) * 0.15;
      this.life  = 0;
      this.maxLife = Math.round(this.len / this.speed) + 20;
      this.delay = immediate ? Math.floor(Math.random() * 80) : Math.floor(Math.random() * 300 + 60);
      this.alpha = Math.random() * 0.35 + 0.45;
    }
    update() {
      if (this.delay > 0) { this.delay--; return; }
      this.life++;
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      if (this.life > this.maxLife) this.reset();
    }
    draw() {
      if (this.delay > 0) return;
      const progress = this.life / this.maxLife;
      const fade = progress < 0.15
        ? progress / 0.15
        : Math.pow(1 - (progress - 0.15) / 0.85, 1.5);

      const tailLen = Math.min(this.life * this.speed, this.len);
      const tx = this.x - Math.cos(this.angle) * tailLen;
      const ty = this.y - Math.sin(this.angle) * tailLen;

      const grad = ctx.createLinearGradient(tx, ty, this.x, this.y);
      grad.addColorStop(0, `rgba(255,255,255,0)`);
      grad.addColorStop(0.6, `rgba(255,255,255,${this.alpha * fade * 0.5})`);
      grad.addColorStop(1, `rgba(255,255,255,${this.alpha * fade})`);

      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(this.x, this.y);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  const streaks = Array.from({ length: 6 }, () => new Streak());

  function drawStaticStars() {
    staticStars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.o})`;
      ctx.fill();
    });
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStaticStars();
    streaks.forEach(s => { s.update(); s.draw(); });
    requestAnimationFrame(loop);
  }
  loop();

  const input = document.getElementById('urlInput');

  function navigate() {
    let val = input.value.trim();
    if (!val) return;
    if (!/^https?:\/\//i.test(val)) val = 'https://' + val;
    window.location.href = 'https://vera-bhoppings.vercel.app/' + val;
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') navigate();
  });
</script>

</body>
