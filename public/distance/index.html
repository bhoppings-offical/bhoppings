<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance — PvP Visuals for 1.8.9</title>
<link rel="icon" type="image/png" href="https://bhoppings.de/distance/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --dim: rgba(255,255,255,0.5);
  --faint: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.1);
  --border-bright: rgba(255,255,255,0.25);
  --glow: rgba(255,255,255,0.15);
  --glass-bg: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.14);
  --glass-highlight: rgba(255,255,255,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) #000; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Syne', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

a, button, input, select, textarea, .liquid-glass, .feature-card, .why-card, .beta-testers .tester-chip {
  cursor: none;
}

@media (pointer: coarse) {
  .cursor, .cursor-ring { display: none !important; }
  body, a, button, .liquid-glass, .feature-card, .why-card { cursor: auto !important; }
}

.cursor {
  position: fixed;
  top: 0; left: 0;
  width: 12px; height: 12px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed;
  top: 0; left: 0;
  width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  mix-blend-mode: difference;
}

.gb-fixed-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: #000;
  overflow: hidden;
  opacity: 0.85;
  isolation: isolate;
}
.gb-fallback {
  position: absolute;
  inset: -10%;
  background: linear-gradient(120deg, #000 0%, #2c2c30 35%, #050505 55%, #1c1c1f 80%, #000 100%);
  background-size: 300% 300%;
  animation: gb-fallback-pan 18s ease-in-out infinite;
}
@keyframes gb-fallback-pan {
  0%, 100% { background-position: 0% 30%; }
  50% { background-position: 100% 70%; }
}
.color-bends-container { position: relative; width: 100%; height: 100%; overflow: hidden; }

.page { position: relative; z-index: 1; isolation: isolate; }

.liquid-glass {
  position: relative;
  background: linear-gradient(155deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 55%), rgba(8,8,10,0.4);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 0 60px rgba(255,255,255,0.02),
    0 24px 60px rgba(0,0,0,0.4);
  isolation: isolate;
  overflow: hidden;
}
@property --gx {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 50%;
}
@property --gy {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 15%;
}
.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(360px circle at var(--gx, 50%) var(--gy, 15%), rgba(255,255,255,0.16), transparent 60%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease, --gx 0.25s ease-out, --gy 0.25s ease-out;
  z-index: 0;
}
.liquid-glass:hover::before,
.liquid-glass:focus-within::before {
  opacity: 0.85;
}
.liquid-glass::after {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  pointer-events: none;
}
.liquid-glass > * { position: relative; z-index: 1; }
.liquid-glass.pill { border-radius: 100px; }
.liquid-glass.tight { border-radius: 12px; }

nav.liquid-glass {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0;
  border-top: none; border-left: none; border-right: none;
  transition: padding 0.35s cubic-bezier(.2,.8,.2,1);
}
nav.liquid-glass.scrolled { padding: 12px 48px; }
.nav-logo { display: flex; align-items: center; gap: 10px; }
.nav-targeter { width: 22px; height: 22px; animation: spin 4s linear infinite; opacity: 0.9; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.nav-brand { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.nav-links { display: flex; gap: 32px; list-style: none; align-items: center; }
.nav-links a { color: var(--dim); text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; font-family: 'DM Mono', monospace; }
.nav-links a:hover { color: white; }
.nav-beta-pill { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; padding: 7px 16px; color: rgba(255,255,255,0.75); text-transform: uppercase; background: rgba(255,255,255,0.07); border: 1px solid var(--border-bright); border-radius: 100px; }

.glow-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  padding: 9px 22px;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 120px 48px 80px;
}
.hero::before {
  content: '';
  position: absolute;
  inset: -10%;
  background: radial-gradient(60% 55% at 50% 42%, rgba(0,0,0,0.6), rgba(0,0,0,0) 72%);
  pointer-events: none;
  z-index: 0;
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}
.hero-logo-wrap {
  perspective: 800px;
  animation: fade-in-up 1s ease 0.2s both;
}
.hero-logo {
  max-width: 520px;
  width: 100%;
  filter: drop-shadow(0 0 40px rgba(255,255,255,0.15));
  transform-style: preserve-3d;
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}
.hero-tagline {
  font-family: 'Syne', sans-serif;
  font-size: clamp(14px, 2vw, 18px);
  font-weight: 400;
  color: rgba(255,255,255,0.5);
  max-width: 480px;
  line-height: 1.7;
  animation: fade-in-up 1s ease 0.4s both;
}
.hero-tagline em { color: rgba(255,255,255,0.85); font-style: normal; }
.hero-cta-group {
  display: flex;
  gap: 16px;
  align-items: center;
  animation: fade-in-up 1s ease 0.6s both;
}
.btn-primary {
  background: white;
  color: black;
  padding: 14px 32px;
  border-radius: 4px;
  font-family: 'Unbounded', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(255,255,255,0.15); }
.btn-secondary {
  color: rgba(255,255,255,0.75);
  padding: 13px 30px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
  background: transparent;
}
.btn-secondary:hover { color: white; }
.hero-scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0.3;
  animation: fade-in 2s ease 1.5s both;
  z-index: 1;
}
.hero-scroll-hint span { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; }
.scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(to bottom, white, transparent);
  animation: scroll-line 2s ease-in-out infinite;
}
@keyframes scroll-line {
  0% { transform: scaleY(0); transform-origin: top; }
  50% { transform: scaleY(1); transform-origin: top; }
  51% { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

.beta-banner.liquid-glass { width: 100%; border-radius: 0; border-left: none; border-right: none; }
.beta-ticker {
  display: flex;
  width: max-content;
  animation: ticker 22s linear infinite;
  padding: 14px 0;
}
.beta-ticker-item { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 40px; white-space: nowrap; }
.beta-ticker-item span { color: rgba(255,255,255,0.6); margin-right: 12px; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

section { padding: 120px 48px; max-width: 1200px; margin: 0 auto; position: relative; }
.section-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.3);
  text-transform: uppercase;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-eyebrow::before { content: ''; width: 24px; height: 1px; background: rgba(255,255,255,0.3); }
.section-title { font-family: 'Unbounded', sans-serif; font-size: clamp(28px, 4vw, 48px); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 20px; }
.section-sub { font-size: 16px; line-height: 1.75; color: rgba(255,255,255,0.45); max-width: 560px; }

.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 64px; }
.why-card {
  padding: 48px;
  position: relative;
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1), background 0.3s;
}
.why-card:hover { transform: translateY(-4px); }
.why-card-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 16px; }
.why-card h3 { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.01em; }
.why-card p { font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.45); }
.why-card p em { color: rgba(255,255,255,0.75); font-style: normal; }
.why-card p i { font-style: italic; color: rgba(255,255,255,0.75); }
.why-card-cross { position: absolute; top: 20px; right: 20px; font-size: 18px; opacity: 0.2; }
.why-card.good .why-card-check {
  position: absolute;
  top: 20px; right: 20px;
  width: 20px; height: 20px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}
.why-card.full { grid-column: 1 / -1; }

.features-section { padding: 120px 0; max-width: 100%; }
.features-inner { padding: 0 48px; max-width: 1200px; margin: 0 auto; }
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 64px;
}
.feature-card {
  padding: 40px 36px;
  position: relative;
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
}
.feature-card:hover { transform: translateY(-4px); }
.feature-icon { width: 40px; height: 40px; margin-bottom: 24px; position: relative; }
.feature-icon-ring {
  width: 40px; height: 40px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  position: relative;
  transition: border-color 0.3s;
  color: rgba(255,255,255,0.6);
}
.feature-card:hover .feature-icon-ring { border-color: rgba(255,255,255,0.5); color: white; }
.feature-card h3 { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 12px; }
.feature-card p { font-size: 13px; line-height: 1.75; color: rgba(255,255,255,0.4); }
.feature-tag {
  display: inline-block;
  margin-top: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 2px;
  transition: all 0.2s;
}
.feature-card:hover .feature-tag { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }

.scripting-section { padding: 80px 48px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
.scripting-card {
  padding: 72px;
  position: relative;
}
.scripting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.code-block {
  background: rgba(0,0,0,0.55);
  border: 1px solid var(--border);
  padding: 28px;
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  line-height: 1.85;
  color: rgba(255,255,255,0.5);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  white-space: pre;
}
.code-kw { color: rgba(255,255,255,0.9); }
.code-fn { color: rgba(255,255,255,0.75); }
.code-str { color: rgba(255,255,255,0.55); }
.code-num { color: rgba(255,255,255,0.7); }
.code-comment { color: rgba(255,255,255,0.2); font-style: italic; }
.code-cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: rgba(255,255,255,0.7);
  animation: blink 1s step-end infinite;
  vertical-align: middle;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.compare-section { padding: 80px 48px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
.compare-card { padding: 8px 40px 40px; margin-top: 48px; }
.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
}
.compare-table th {
  text-align: left;
  padding: 20px 16px;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  border-bottom: 1px solid var(--border);
  font-weight: 400;
}
.compare-table td {
  padding: 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.55);
  vertical-align: top;
  line-height: 1.6;
}
.compare-table tr:last-child td { border-bottom: none; }
.compare-table tr:hover td { background: rgba(255,255,255,0.03); }
.compare-table td:first-child { color: rgba(255,255,255,0.8); font-weight: 500; }
.check { color: rgba(255,255,255,0.9); font-size: 16px; }
.cross { color: rgba(255,255,255,0.2); font-size: 16px; }
.col-distance { color: white !important; font-weight: 600; }

.beta-section { padding: 80px 48px 160px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
.beta-card {
  padding: 80px;
  text-align: center;
  position: relative;
}
.beta-card::before {
  content: '';
  position: absolute;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
  animation: pulse-glow 4s ease-in-out infinite;
  opacity: 1;
  pointer-events: none;
  z-index: 0;
}
.beta-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 100px;
  margin-bottom: 32px;
}
.beta-dot { width: 6px; height: 6px; border-radius: 50%; background: white; opacity: 0.5; animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
@keyframes pulse-glow {
  0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.6; transform: translateX(-50%) scale(1.15); }
}
.beta-card h2 { font-family: 'Unbounded', sans-serif; font-size: clamp(24px, 4vw, 42px); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 20px; }
.beta-card p { color: rgba(255,255,255,0.4); font-size: 15px; line-height: 1.7; max-width: 480px; margin: 0 auto 40px; }
.btn-disabled {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.25);
  padding: 16px 40px;
  border-radius: 4px;
  font-family: 'Unbounded', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  cursor: not-allowed !important;
  display: inline-block;
  text-decoration: none;
}
.beta-testers { margin-top: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.beta-testers-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.2); text-transform: uppercase; margin-right: 8px; }
.tester-chip { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.55); padding: 6px 14px; }

.footer-wrap { border-top: 1px solid var(--border); position: relative; z-index: 1; }
footer {
  padding: 40px 48px;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.footer-left { display: flex; align-items: center; gap: 12px; }
.footer-targeter { width: 16px; height: 16px; animation: spin 6s linear infinite; opacity: 0.5; }
.footer-brand { font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
.footer-right { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.2); letter-spacing: 0.05em; }
.footer-note { text-align: center; padding-bottom: 32px; font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.1); letter-spacing: 0.08em; }

@keyframes fade-in-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in-down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.rv-fade { opacity: 0; transform: translateY(28px); transition: opacity 0.9s cubic-bezier(.2,.7,.3,1), transform 0.9s cubic-bezier(.2,.7,.3,1); }
.rv-fade.in { opacity: 1; transform: translateY(0); }

.rv-clip { opacity: 1; clip-path: inset(0 0 100% 0); transition: clip-path 0.9s cubic-bezier(.16,1,.3,1); }
.rv-clip.in { clip-path: inset(0 0 0% 0); }

.rv-stagger-item { opacity: 0; transform: translateY(24px) scale(0.98); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--d, 0) * 90ms); }
.rv-stagger-item.in { opacity: 1; transform: translateY(0) scale(1); }

.rv-word-wrap .word { display: inline-block; opacity: 0.12; filter: blur(6px); transform: rotate(2deg); transition: opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease; transition-delay: calc(var(--i, 0) * 26ms); }
.rv-word-wrap.in .word { opacity: 1; filter: blur(0); transform: rotate(0deg); }

.divider { width: 100%; height: 1px; background: var(--border); position: relative; z-index: 1; }

.gradual-blur-bottom {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 15rem;
  z-index: 40;
  pointer-events: none;
}
.gradual-blur-bottom > div { position: absolute; inset: 0; }

@media (max-width: 900px) {
  .why-grid { grid-template-columns: 1fr; }
  .features-grid { grid-template-columns: 1fr; }
  .scripting-grid { grid-template-columns: 1fr; gap: 32px; }
  .compare-section, .scripting-section, .beta-section { padding-left: 24px; padding-right: 24px; }
  section { padding: 90px 24px; }
  nav.liquid-glass { padding: 16px 24px; }

<noscript>Distance needs JavaScript enabled to render — this page is built with React.</noscript>

<script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script defer src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function ColorBends({
  className = '',
  style,
  rotation = 100,
  speed = 0.15,
  colors = ['#8c8c94', '#48484e', '#1c1c1f'],
  transparent = true,
  autoRotate = 0,
  scale = 1.1,
  frequency = 1,
  warpStrength = 0.8,
  mouseInfluence = 1,
  parallax = 0.4,
  noise = 0,
  iterations = 2,
  intensity = 0.85,
  bandWidth = 5
}) {
  const containerRef = useRef(null);
  const rendererRef = useRef(null);
  const rafRef = useRef(null);
  const materialRef = useRef(null);
  const resizeObserverRef = useRef(null);
  const rotationRef = useRef(rotation);
  const autoRotateRef = useRef(autoRotate);
  const pointerTargetRef = useRef({ x: 0, y: 0 });
  const pointerCurrentRef = useRef({ x: 0, y: 0 });
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    let cancelled = false;
    const cleanupFns = [];

    (async () => {
      const container = containerRef.current;
      if (!container) return;

      let THREE;
      try {
        THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/+esm');
      } catch (err) {
        if (!cancelled) setFailed(true);
        return;
      }
      if (cancelled || !container.isConnected) return;

      try {
      const MAX_COLORS = 8;
      const frag = `
#define MAX_COLORS ${MAX_COLORS}
uniform vec2 uCanvas;
uniform float uTime;
uniform float uSpeed;
uniform vec2 uRot;
uniform int uColorCount;
uniform vec3 uColors[MAX_COLORS];
uniform int uTransparent;
uniform float uScale;
uniform float uFrequency;
uniform float uWarpStrength;
uniform vec2 uPointer;
uniform float uMouseInfluence;
uniform float uParallax;
uniform float uNoise;
uniform int uIterations;
uniform float uIntensity;
uniform float uBandWidth;
varying vec2 vUv;

void main() {
  float t = uTime * uSpeed;
  vec2 p = vUv * 2.0 - 1.0;
  p += uPointer * uParallax * 0.1;
  vec2 rp = vec2(p.x * uRot.x - p.y * uRot.y, p.x * uRot.y + p.y * uRot.x);
  vec2 q = vec2(rp.x * (uCanvas.x / uCanvas.y), rp.y);
  q /= max(uScale, 0.0001);
  q /= 0.5 + 0.2 * dot(q, q);
  q += 0.2 * cos(t) - 2.5;
  vec2 toward = (uPointer - rp);
  q += toward * uMouseInfluence * 0.2;

    for (int j = 0; j < 5; j++) {
      if (j >= uIterations - 1) break;
      vec2 rr = sin(1.5 * (q.yx * uFrequency) + 2.0 * cos(q * uFrequency));
      q += (rr - q) * 0.15;
    }

    vec3 col = vec3(0.0);
    float a = 1.0;

    if (uColorCount > 0) {
      vec2 s = q;
      vec3 sumCol = vec3(0.0);
      float cover = 0.0;
      for (int i = 0; i < MAX_COLORS; ++i) {
            if (i >= uColorCount) break;
            s -= 0.01;
            vec2 r = sin(1.5 * (s.yx * uFrequency) + 2.0 * cos(s * uFrequency));
            float m0 = length(r + sin(5.0 * r.y * uFrequency - 3.0 * t + float(i)) / 4.0);
            float kBelow = clamp(uWarpStrength, 0.0, 1.0);
            float kMix = pow(kBelow, 0.3);
            float gain = 1.0 + max(uWarpStrength - 1.0, 0.0);
            vec2 disp = (r - s) * kBelow;
            vec2 warped = s + disp * gain;
            float m1 = length(warped + sin(5.0 * warped.y * uFrequency - 3.0 * t + float(i)) / 4.0);
            float m = mix(m0, m1, kMix);
            float w = 1.0 - exp(-uBandWidth / exp(uBandWidth * m));
            sumCol += uColors[i] * w;
            cover = max(cover, w);
      }
      col = clamp(sumCol, 0.0, 1.0);
      a = uTransparent > 0 ? cover : 1.0;
    } else {
        vec2 s = q;
        for (int k = 0; k < 3; ++k) {
            s -= 0.01;
            vec2 r = sin(1.5 * (s.yx * uFrequency) + 2.0 * cos(s * uFrequency));
            float m0 = length(r + sin(5.0 * r.y * uFrequency - 3.0 * t + float(k)) / 4.0);
            float kBelow = clamp(uWarpStrength, 0.0, 1.0);
            float kMix = pow(kBelow, 0.3);
            float gain = 1.0 + max(uWarpStrength - 1.0, 0.0);
            vec2 disp = (r - s) * kBelow;
            vec2 warped = s + disp * gain;
            float m1 = length(warped + sin(5.0 * warped.y * uFrequency - 3.0 * t + float(k)) / 4.0);
            float m = mix(m0, m1, kMix);
            col[k] = 1.0 - exp(-uBandWidth / exp(uBandWidth * m));
        }
        a = uTransparent > 0 ? max(max(col.r, col.g), col.b) : 1.0;
    }

    col *= uIntensity;

    if (uNoise > 0.0001) {
      float n = fract(sin(dot(gl_FragCoord.xy + vec2(uTime), vec2(12.9898, 78.233))) * 43758.5453123);
      col += (n - 0.5) * uNoise;
      col = clamp(col, 0.0, 1.0);
    }

    vec3 rgb = (uTransparent > 0) ? col * a : col;
    gl_FragColor = vec4(rgb, a);
}
`;
      const vert = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}
`;

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const geometry = new THREE.PlaneGeometry(2, 2);
      const uColorsArray = Array.from({ length: MAX_COLORS }, () => new THREE.Vector3(0, 0, 0));
      const material = new THREE.ShaderMaterial({
        vertexShader: vert,
        fragmentShader: frag,
        uniforms: {
          uCanvas: { value: new THREE.Vector2(1, 1) },
          uTime: { value: 0 },
          uSpeed: { value: speed },
          uRot: { value: new THREE.Vector2(1, 0) },
          uColorCount: { value: 0 },
          uColors: { value: uColorsArray },
          uTransparent: { value: transparent ? 1 : 0 },
          uScale: { value: scale },
          uFrequency: { value: frequency },
          uWarpStrength: { value: warpStrength },
          uPointer: { value: new THREE.Vector2(0, 0) },
          uMouseInfluence: { value: mouseInfluence },
          uParallax: { value: parallax },
          uNoise: { value: noise },
          uIterations: { value: iterations },
          uIntensity: { value: intensity },
          uBandWidth: { value: bandWidth }
        },
        premultipliedAlpha: true,
        transparent: true
      });
      materialRef.current = material;

      const toVec3 = hex => {
        const h = hex.replace('#', '').trim();
        const v =
          h.length === 3
            ? [parseInt(h[0] + h[0], 16), parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16)]
            : [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        return new THREE.Vector3(v[0] / 255, v[1] / 255, v[2] / 255);
      };
      const arr = (colors || []).filter(Boolean).slice(0, MAX_COLORS).map(toVec3);
      for (let i = 0; i < MAX_COLORS; i++) {
        if (i < arr.length) uColorsArray[i].copy(arr[i]);
      }
      material.uniforms.uColorCount.value = arr.length;

      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', alpha: true });
      rendererRef.current = renderer;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, transparent ? 0 : 1);
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      renderer.domElement.style.display = 'block';
      container.appendChild(renderer.domElement);

      const clock = new THREE.Clock();

      const handleResize = () => {
        const w = container.clientWidth || 1;
        const h = container.clientHeight || 1;
        renderer.setSize(w, h, false);
        material.uniforms.uCanvas.value.set(w, h);
      };
      handleResize();

      const ro = new ResizeObserver(handleResize);
      ro.observe(container);

      const onPointerMove = e => {
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / (rect.width || 1)) * 2 - 1;
        const y = -(((e.clientY - rect.top) / (rect.height || 1)) * 2 - 1);
        pointerTargetRef.current = { x, y };
      };
      window.addEventListener('pointermove', onPointerMove);

      const loop = () => {
        const dt = clock.getDelta();
        const elapsed = clock.elapsedTime;
        material.uniforms.uTime.value = elapsed;

        const deg = (rotationRef.current % 360) + autoRotateRef.current * elapsed;
        const rad = (deg * Math.PI) / 180;
        material.uniforms.uRot.value.set(Math.cos(rad), Math.sin(rad));

        const cur = pointerCurrentRef.current;
        const tgt = pointerTargetRef.current;
        const amt = Math.min(1, dt * 8);
        cur.x += (tgt.x - cur.x) * amt;
        cur.y += (tgt.y - cur.y) * amt;
        material.uniforms.uPointer.value.set(cur.x, cur.y);

        renderer.render(scene, camera);
        rafRef.current = requestAnimationFrame(loop);
      };
      rafRef.current = requestAnimationFrame(loop);

      cleanupFns.push(() => {
        if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
        window.removeEventListener('pointermove', onPointerMove);
        ro.disconnect();
        geometry.dispose();
        material.dispose();
        renderer.dispose();
        renderer.forceContextLoss();
        if (renderer.domElement && renderer.domElement.parentElement === container) {
          container.removeChild(renderer.domElement);
        }
      });
      } catch (err) {
        console.error('ColorBends failed to initialize', err);
        if (!cancelled) setFailed(true);
      }
    })();

    return () => {
      cancelled = true;
      cleanupFns.forEach(fn => fn());
    };
  }, []);

  return (
    <>
      <div className="gb-fallback" style={{ opacity: failed ? 1 : 0, transition: 'opacity 1.2s ease' }} />
      <div ref={containerRef} className={`color-bends-container ${className}`} style={style} />
    </>
  );
}

function useInView(ref, opts = {}) {
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            setInView(true);
            obs.disconnect();
          }
        });
      },
      { threshold: opts.threshold ?? 0.15, rootMargin: opts.rootMargin ?? '0px 0px -10% 0px' }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return inView;
}

function splitToWordNodes(children) {
  const nodes = React.Children.toArray(children);
  const out = [];
  let counter = 0;
  nodes.forEach((node, ni) => {
    if (typeof node === 'string') {
      const parts = node.split(/(\s+)/);
      parts.forEach((part, pi) => {
        if (part === '') return;
        if (/^\s+$/.test(part)) {
          out.push(part);
          return;
        }
        const idx = counter++;
        out.push(
          <span key={`t-${ni}-${pi}`} className="word" style={{ '--i': idx }}>
            {part}
          </span>
        );
      });
    } else if (React.isValidElement(node) && node.type === 'br') {
      out.push(React.cloneElement(node, { key: `br-${ni}` }));
    } else if (React.isValidElement(node)) {
      const idx = counter++;
      out.push(
        React.cloneElement(node, {
          key: `el-${ni}`,
          className: `${node.props.className || ''} word`.trim(),
          style: { ...(node.props.style || {}), '--i': idx }
        })
      );
    } else {
      out.push(node);
    }
  });
  return out;
}

function Reveal({ as = 'div', variant = 'fade', delay = 0, className = '', children, ...rest }) {
  const ref = useRef(null);
  const inView = useInView(ref);
  const Tag = as;

  if (variant === 'words') {
    return (
      <Tag ref={ref} className={`rv-word-wrap ${inView ? 'in' : ''} ${className}`} {...rest}>
        {splitToWordNodes(children)}
      </Tag>
    );
  }

  const cls = variant === 'clip' ? 'rv-clip' : 'rv-fade';
  return (
    <Tag ref={ref} className={`${cls} ${inView ? 'in' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }} {...rest}>
      {children}
    </Tag>
  );
}

function RevealGroup({ children, className = '' }) {
  const ref = useRef(null);
  const inView = useInView(ref, { threshold: 0.08 });
  const kids = React.Children.toArray(children);
  return (
    <div ref={ref} className={className}>
      {kids.map((child, i) =>
        React.isValidElement(child)
          ? React.cloneElement(child, {
              className: `${child.props.className || ''} rv-stagger-item ${inView ? 'in' : ''}`.trim(),
              style: { ...(child.props.style || {}), '--d': i }
            })
          : child
      )}
    </div>
  );
}

function Glass({ as = 'div', pill = false, tight = false, className = '', children, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = null;
    let pending = null;
    const apply = () => {
      raf = null;
      if (!pending || !el.isConnected) return;
      el.style.setProperty('--gx', `${pending.x}%`);
      el.style.setProperty('--gy', `${pending.y}%`);
    };
    const onMove = e => {
      const r = el.getBoundingClientRect();
      pending = {
        x: ((e.clientX - r.left) / r.width) * 100,
        y: ((e.clientY - r.top) / r.height) * 100
      };
      if (raf == null) raf = requestAnimationFrame(apply);
    };
    el.addEventListener('pointermove', onMove);
    return () => {
      el.removeEventListener('pointermove', onMove);
      if (raf != null) cancelAnimationFrame(raf);
    };
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} className={`liquid-glass ${pill ? 'pill' : ''} ${tight ? 'tight' : ''} ${className}`.trim()} {...rest}>
      {children}
    </Tag>
  );

}

function BottomGradualBlur() {
  const divCount = 8;
  const strength = 3;
  const curve = p => p * p * (3 - 2 * p);
  const increment = 100 / divCount;
  const layers = [];
  for (let i = 1; i <= divCount; i++) {
    const progress = curve(i / divCount);
    const blurValue = Math.pow(2, progress * 4) * 0.0625 * strength;
    const p1 = Math.round((increment * i - increment) * 10) / 10;
    const p2 = Math.round(increment * i * 10) / 10;
    const p3 = Math.round((increment * i + increment) * 10) / 10;
    const p4 = Math.round((increment * i + increment * 2) * 10) / 10;
    let gradient = `transparent ${p1}%, black ${p2}%`;
    if (p3 <= 100) gradient += `, black ${p3}%`;
    if (p4 <= 100) gradient += `, transparent ${p4}%`;
    layers.push({ i, blurValue, gradient });
  }
  return (
    <div className="gradual-blur-bottom" aria-hidden="true">
      {layers.map(l => (
        <div
          key={l.i}
          style={{
            maskImage: `linear-gradient(to bottom, ${l.gradient})`,
            WebkitMaskImage: `linear-gradient(to bottom, ${l.gradient})`,
            backdropFilter: `blur(${l.blurValue.toFixed(3)}rem)`,
            WebkitBackdropFilter: `blur(${l.blurValue.toFixed(3)}rem)`
          }}
        />
      ))}
    </div>
  );
}

function CustomCursor() {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const pos = useRef({ mx: 0, my: 0, rx: 0, ry: 0 });

  useEffect(() => {
    const onMove = e => {
      pos.current.mx = e.clientX;
      pos.current.my = e.clientY;
      if (dotRef.current) {
        dotRef.current.style.left = e.clientX + 'px';
        dotRef.current.style.top = e.clientY + 'px';
      }
      const logo = document.getElementById('heroLogo');
      if (logo) {
        const rect = logo.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const distX = e.clientX - cx;
        const distY = e.clientY - cy;
        const dist = Math.sqrt(distX * distX + distY * distY);
        const maxDist = 320;
        const proximity = Math.max(0, 1 - dist / maxDist);
        const maxTilt = 6;
        const rotX = -((distY / (rect.height / 2)) * maxTilt) * proximity;
        const rotY = ((distX / (rect.width / 2)) * maxTilt) * proximity;
        logo.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      }
    };
    const onLeave = () => {
      const logo = document.getElementById('heroLogo');
      if (logo) logo.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseleave', onLeave);

    let raf;
    const animateRing = () => {
      pos.current.rx += (pos.current.mx - pos.current.rx) * 0.12;
      pos.current.ry += (pos.current.my - pos.current.ry) * 0.12;
      if (ringRef.current) {
        ringRef.current.style.left = pos.current.rx + 'px';
        ringRef.current.style.top = pos.current.ry + 'px';
      }
      raf = requestAnimationFrame(animateRing);
    };
    raf = requestAnimationFrame(animateRing);

    const HOVER_SEL = 'a, button, .feature-card, .why-card, .liquid-glass, .tester-chip';
    const onOver = e => {
      const target = e.target.closest && e.target.closest(HOVER_SEL);
      if (!target) return;
      if (dotRef.current) {
        dotRef.current.style.width = '20px';
        dotRef.current.style.height = '20px';
      }
      if (ringRef.current) {
        ringRef.current.style.width = '50px';
        ringRef.current.style.height = '50px';
      }
    };
    const onOut = e => {
      const target = e.target.closest && e.target.closest(HOVER_SEL);
      if (!target) return;
      if (dotRef.current) {
        dotRef.current.style.width = '12px';
        dotRef.current.style.height = '12px';
      }
      if (ringRef.current) {
        ringRef.current.style.width = '36px';
        ringRef.current.style.height = '36px';
      }
    };
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);

    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseleave', onLeave);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <>
      <div className="cursor" ref={dotRef} />
      <div className="cursor-ring" ref={ringRef} />
    </>
  );
}

function Nav() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <Glass as="nav" className={scrolled ? 'scrolled' : ''}>
      <div className="nav-logo">
        <img src="https://bhoppings.de/distance/distance_small.png" className="nav-targeter" alt="" loading="eager" decoding="async" width="22" height="22" />
        <span className="nav-brand">Distance</span>
      </div>
      <ul className="nav-links">
        <li><a href="https://distance.bhoppings.de/#features">Features</a></li>
        <li><a href="https://distance.bhoppings.de/#why">Why Distance</a></li>
        <li><a href="https://distance.bhoppings.de/#scripting">Scripting API</a></li>
        <li><a href="https://distance.bhoppings.de/#beta">Download</a></li>
      </ul>
      <span className="nav-beta-pill">Private Beta</span>
    </Glass>
  );
}

function Hero() {

    <section className="hero">
      <div className="hero-content">
        <Glass as="div" pill className="glow-pill" style={{ animation: 'fade-in-down 0.8s ease forwards' }}>

        </Glass>
        <div className="hero-logo-wrap">

function TickerBar() {
  const items = ['Targeter', 'Item Shaders', 'Player Shaders', 'Sky Shaders', 'Jump Circles', 'Scripting API', '1.8.9 Native', 'Community First', 'by bhoppings'];
  const doubled = [...items, ...items];

function FeaturesSection() {

    <div className="features-section" id="features">

        <Reveal variant="clip">
          <div className="section-eyebrow">Features</div>

        </Reveal>
        <Reveal variant="fade" delay={120}>

        <RevealGroup className="features-grid">

            <Glass as="div" key={f.title} className="feature-card">

function ScriptingSection() {
  const codeHtml = `<span class="code-comment">// FPS display — render2d hook</span>
<span class="code-kw">Distance</span>.<span class="code-fn">on</span>(<span class="code-str">"render2d"</span>, <span class="code-kw">function</span> () {
  <span class="code-kw">var</span> fps = <span class="code-kw">Distance</span>.<span class="code-fn">getFPS</span>();
  <span class="code-kw">var</span> color = fps &lt; <span class="code-num">30</span>
    ? <span class="code-num">0xFF5555</span>
    : fps &lt; <span class="code-num">60</span>
    ? <span class="code-num">0xFFFF55</span>
    : <span class="code-num">0x55FF55</span>;
  <span class="code-kw">Distance</span>.<span class="code-fn">drawTextShadow</span>(
    <span class="code-str">"FPS: "</span> + fps,
    <span class="code-kw">Distance</span>.<span class="code-fn">getScreenWidth</span>() - <span class="code-num">75</span>,
    <span class="code-num">15</span>,
    color
  );
}); <span class="code-cursor"></span>`;

  return (
    <section className="scripting-section" id="scripting">
      <Reveal variant="fade">
        <Glass className="scripting-card">
          <div className="scripting-grid">
            <div>
              <div className="section-eyebrow">Scripting API</div>
              <h2 className="section-title" style={{ fontSize: 'clamp(22px, 3vw, 38px)' }}>Not just visuals.<br />Anything.</h2>
              <p className="section-sub" style={{ marginTop: '20px' }}>The Distance Scripting API opens the door to anything — not just cosmetic effects. Utility tools, automation, custom gameplay overlays. If you can write it, Distance can run it. Easy as f***.</p>
            </div>
            <div className="code-block" dangerouslySetInnerHTML={{ __html: codeHtml }} />
          </div>
        </Glass>
      </Reveal>
    </section>
  );
}

function WhySection() {
  return (
    <section id="why">
      <Reveal variant="clip">
        <div className="section-eyebrow">Why Distance</div>
        <h2 className="section-title">No PR team.<br />No gray area.</h2>
      </Reveal>
      <Reveal variant="fade" delay={120}>
        <p className="section-sub">There's already a PvP visuals mod for newer versions. It's fine. But it's also very... careful. Distance isn't careful. Distance ships what the community actually wants.</p>
      </Reveal>
      <RevealGroup className="why-grid">
        <Glass className="why-card">
          <div className="why-card-label">Others (e.g. Soup Visuals)</div>
          <span className="why-card-cross">✕</span>
          <h3>Image Over Community</h3>
          <p>
            Soup Visuals exists for newer versions but will <em>never</em> be backported to 1.8.9. It operates in a PR-safe bubble — no gray area features, nothing edgy, nothing that could be controversial. Who
            cares if a module is banned on a server? Just don't use it. (<i>or do</i>) The community asks, and the answer is usually no.
          </p>
        </Glass>
        <Glass className="why-card good">
          <div className="why-card-label">Distance</div>
          <div className="why-card-check">✓</div>
          <h3>Community Over Image</h3>
          <p>
            Distance doesn't have a PR department. It has <em>bhoppings</em>, a dev who actually plays 1.8.9 PvP and builds what the scene wants. No public image to protect. No corporate caution. If the
            community wants something and it's possible, it ships. That's it. That's the whole philosophy.
          </p>
        </Glass>
        <Glass className="why-card full">
          <div className="why-card-label">The Bottom Line</div>
          <h3>Built for 1.8.9. Built for real.</h3>
          <p style={{ maxWidth: '700px' }}>
            1.8.9 PvP isn't going anywhere. It's arguably the most active version for competitive Minecraft and has been for over a decade. Distance is the first mod to take that seriously from a{' '}
            <em>visual design perspective</em> — not ported, not watered down, built from the ground up for this version and this community.
          </p>
        </Glass>
      </RevealGroup>
    </section>
  );
}

const COMPARE_ROWS = [
  ['Minecraft 1.8.9 native', true, false],
  ['Targeter on hovered players', true, 'dim'],
  ['Item Shaders', true, 'dim'],
  ['Player Shaders', true, false],
  ['Sky Shader Animations', true, false],
  ['Jump Circles', true, 'dim'],
  ['Full Scripting API', true, false],
  ['Backport planned', 'na', 'never'],
  ['Ships gray-area features', 'always', 'safe']
];

function CompareCell({ value }) {
  if (value === true) return <td className="col-distance check">✓</td>;
  if (value === false) return <td className="cross">✕</td>;
  if (value === 'dim') return <td className="check" style={{ color: 'rgba(255,255,255,0.5)' }}>✓</td>;
  if (value === 'na') return <td className="col-distance check" style={{ fontSize: '11px' }}>N/A — already here</td>;
  if (value === 'never') return <td className="cross" style={{ fontSize: '11px', color: 'rgba(255,255,255,0.3)' }}>Never</td>;
  if (value === 'always') return <td className="col-distance check">✓ Always</td>;
  if (value === 'safe') return <td className="cross" style={{ fontSize: '11px', color: 'rgba(255,255,255,0.3)' }}>When PR-safe only</td>;
  return <td>{value}</td>;
}

function CompareSection() {
  return (
    <section className="compare-section">
      <Reveal variant="clip">
        <div className="section-eyebrow">Comparison</div>
        <h2 className="section-title">Distance vs.<br />The rest.</h2>
      </Reveal>
      <Reveal variant="fade" delay={100}>
        <Glass className="compare-card">
          <table className="compare-table">
            <thead>
              <tr>
                <th>Feature</th>
                <th className="col-distance">Distance</th>
                <th>Soup Visuals</th>
              </tr>
            </thead>
            <tbody>
              {COMPARE_ROWS.map(row => (
                <tr key={row[0]}>
                  <td>{row[0]}</td>
                  <CompareCell value={row[1]} />
                  <CompareCell value={row[2]} />
                </tr>
              ))}
            </tbody>
          </table>
        </Glass>
      </Reveal>
    </section>
  );
}
