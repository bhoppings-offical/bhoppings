<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <style>
      :root {
        --bg-1: #f8f3e8;
        --bg-2: #dfe9f7;
        --ink: #121212;
        --muted: #4b4b4b;
        --accent: #0f4c81;
        --accent-2: #ff6b35;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 800px at 10% 10%, var(--bg-2), transparent 60%),
          radial-gradient(1000px 700px at 90% 20%, #ffe8cc, transparent 60%),
          linear-gradient(135deg, var(--bg-1), #ffffff 60%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .card {
        width: min(520px, 92vw);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 18px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(6px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.4;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 10px;
        text-decoration: none;
        background: var(--accent);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        border: 1px solid rgba(0, 0, 0, 0.1);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 76, 129, 0.25);
      }
      .meta {
        margin-top: 20px;
        font-size: 14px;
        color: #6a6a6a;
      }
      .meta a { color: var(--accent-2); text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      <p>Use your GitHub account to continue. We only read basic profile info.</p>
      <form id="signin-form" method="post" action="/auth/signin/github">
        <input type="hidden" name="csrfToken" value="" />
        <input type="hidden" name="callbackUrl" value="/" />
        <button class="cta" type="submit">Continue with GitHub</button>
      </form>
      <div class="meta">Need help? <a href="/">Return home</a></div>
    </main>
    <script>
      async function hydrateCsrf() {
        try {
          const res = await fetch("/auth/csrf");
          if (!res.ok) return;
          const data = await res.json();
          const input = document.querySelector('input[name="csrfToken"]');
          if (input && data.csrfToken) input.value = data.csrfToken;
        } catch (_) {
          // No-op: the POST will fail without a token, but the page stays usable.
        }
      }
      hydrateCsrf();
    </script>
  </body>
</html>
