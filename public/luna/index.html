<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna</title>
<meta name="description" content="eye candy for ear candy.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --base: #1c1c1e;
  --w: #fff;
  --w90: rgba(255,255,255,.92);
  --w60: rgba(255,255,255,.62);
  --w08: rgba(255,255,255,.08);
  --w12: rgba(255,255,255,.12);
  --border:  rgba(255,255,255,.10);
  --border2: rgba(255,255,255,.20);
  --font:  'DM Sans', system-ui, sans-serif;
  --serif: 'Instrument Serif', serif;
  --ease:  cubic-bezier(.22,.8,.24,1);
}

html, body {
  width: 100%; height: 100%;
  background: var(--base);
  color: var(--w);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

#liquid {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%; display: block;
  background: radial-gradient(120% 90% at 30% 15%, #323235 0%, #1c1c1e 70%);
}
#grain {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .05; mix-blend-mode: overlay;
  background-size: 160px 160px;
}

main {
  position: relative; z-index: 1;
  min-height: 100%;
  padding: 32px 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  animation: rise .9s var(--ease) both;
}
@keyframes rise { from { opacity: 0; } to { opacity: 1; } }

h1 {
  font-family: var(--serif);
  font-style: italic; font-weight: 400;
  font-size: clamp(76px, 15vw, 168px);
  line-height: 1;
  letter-spacing: -.01em;
  color: var(--w90);
  text-shadow: 0 6px 40px rgba(0,0,0,.35);
}

p {
  margin-top: 6px;
  font-size: clamp(15px, 2vw, 18px);
  font-weight: 300;
  letter-spacing: .01em;
  color: var(--w60);
}

.dl { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 22px 0 18px;
  border-radius: 14px;
  font-size: 14px; font-weight: 500; letter-spacing: -.005em;
  color: var(--w90); text-decoration: none;
  background: rgba(18,18,20,.40);
  border: 1px solid var(--border);
  backdrop-filter: blur(30px) saturate(1.5);
  -webkit-backdrop-filter: blur(30px) saturate(1.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  transition: background .15s, border-color .15s, color .15s, transform .12s var(--ease);
}
.btn:hover { background: rgba(255,255,255,.10); border-color: var(--border2); color: var(--w); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--w60); outline-offset: 3px; }
.btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>

<canvas id="liquid"></canvas>
<div id="grain"></div>

<main>
  <h1>Luna</h1>
  <p>eye candy for ear candy.</p>

  <div class="dl">
    <a class="btn" href="Luna_Installer.exe" download id="dl-windows">
      <svg viewBox="0 0 24 24"><path d="M3 5.5l7.5-1v7H3z"/><path d="M12 4.3l9-1.3v8.5h-9z"/><path d="M3 12.5h7.5v7L3 18.5z"/><path d="M12 12.5h9V21l-9-1.3z"/></svg>
      Windows
    </a>
    <a class="btn" href="Luna.tar.gz" download id="dl-linux">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M7.5 10l3 2.5-3 2.5"/><path d="M13 15h4"/></svg>
      Linux
    </a>
  </div>
</main>

<script src="liquid.js"></script>
<script>
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const bg = new LiquidBG($('#liquid'));
bg.setMotion(REDUCED ? 0 : 1);

(function makeGrain() {
  const n = 160, c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d'), d = g.createImageData(n, n);
  for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i+1] = d.data[i+2] = Math.random() * 255; d.data[i+3] = 255; }
  g.putImageData(d, 0, 0);
  $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();
</script>
</body>
</html>
