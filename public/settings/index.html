<!DOCTYPE HTML>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Settings - Bhoppings</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/global/home.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<meta name="apple-mobile-web-app-title" content="Settings - Bhoppings">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#000000">
<meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

<meta name="format-detection" content="telephone=no">
<meta name="format-detection" content="email=no">
<meta name="format-detection" content="address=no">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/icons/apple-touch.png">
<link rel="apple-touch-icon" sizes="152x152" href="/assets/images/icons/apple-touch.png">
<link rel="apple-touch-icon" sizes="120x120" href="/assets/images/icons/apple-touch.png">
<link rel="apple-touch-icon" sizes="76x76" href="/assets/images/icons/apple-touch.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-startup-image" href="/assets/images/icons/apple-touch.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preload" href="/assets/images/cursor.svg" />

  </head>
  <body>
      <div id="grain"></div>
      <canvas id="effectCanvas"></canvas>

      <div id="container">
        <div id="sidebar-container">
          <div id="settings-sidebar" class="box">
            <div class="sidebar-button" id="sidebar-button-cursor"></div>
            <div class="sidebar-button" id="sidebar-button-theme"></div>
            <div class="sidebar-button" id="sidebar-button-effect"></div>
          </div>
        </div>
        <div id="settings-content-container">
          <h1>Cursor</h1>
          <div class="settings-section" id="cursor-section">
            <div class="settings-item">
              <div class="settings-item-icon"></div>
              <div class="settings-item-button">Apply</div>
            </div>
          </div>
          <h1>Theme</h1>
          <div class="settings-section" id="theme-section">
            <div class="settings-item">
              <div class="settings-item-icon"></div>
              <div class="settings-item-button">Apply</div>
            </div>
          </div>
          <h1>Background Effect</h1>
          <div class="settings-section" id="effect-section">
            <div class="settings-item">
              <div class="settings-item-icon"></div>
              <div class="settings-item-button">Apply</div>
            </div>
          </div>
        </div>
      </div>
      
  </body>
  <script src="/global/settings-init.js"></script>
  <script src="./settings.js"></script>
  <script src="/global/home-effects.js"></script>
  <script src="/components/navbar.js"></script>
</html>
